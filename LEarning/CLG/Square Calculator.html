<!DOCTYPEhtml>
<html>
<head><title> Square Calculatoe </title></head>
<body>
<h4>To Do This Again!! Simply Reload The Page</h4>
<script type = text/javascript>
var s, squ
s = prompt("Enter A Number to convert into square: ")
squ = s*s
document.write("<h3>Number: </h3>" + s)
document.write("<h3>Square of your number: </h3>" + squ +"<sup> 2 </sup>")
</script>
</body>
</html>
